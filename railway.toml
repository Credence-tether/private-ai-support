[build]
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "node .output/server/index.mjs"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.variables]
RAILPACK_NO_SPA = "1"
NITRO_PRESET = "node-server"

[environments.production.variables]
NODE_ENV = "production"
