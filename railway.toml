[build]
buildCommand = "npm install && npm run build"

[build.variables]
NITRO_PRESET = "node-server"
RAILPACK_NO_SPA = "1"

[deploy]
startCommand = "node .output/server/index.mjs"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
NODE_ENV = "production"
